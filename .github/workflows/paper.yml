name: paper desk

# The $50 paper experiments: BTC, ETH and SOL, $50 each, separate accounts. Every 15
# minutes: load the ledgers from the `paper-ledger` branch, run one desk step per coin
# on live Hyperliquid prices, save the ledgers if anything happened, and publish the
# boards to GitHub Pages. A coin whose step fails (say, a rate-limited API call) is
# retried next run; the other coins are still saved and published.
# GitHub delays (and under load drops) scheduled runs, worst at the top of the hour,
# so the schedule avoids :00 and runs at :04/:19/:34/:49 — each 2h bar closes on an
# even hour and is picked up 4 minutes later. `step` catches up on every bar it
# missed, so a late or skipped run never loses or double-counts a bar.

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-desk
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Load the ledger
        run: |
          if git fetch --depth=1 origin paper-ledger; then
            git checkout FETCH_HEAD -- ledger/
          else
            echo "no paper-ledger branch yet: the step opens a new \$50 ledger"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Desk step
        id: step
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m desk step

      - name: Save the ledgers
        if: ${{ !cancelled() && steps.step.outputs.changed == 'true' }}
        run: |
          git config user.name "paper-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work="$RUNNER_TEMP/ledger-branch"
          if git fetch --depth=1 origin paper-ledger; then
            git worktree add "$work" FETCH_HEAD
            git -C "$work" checkout -B paper-ledger
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan paper-ledger
            git -C "$work" rm -rfq .
          fi
          git -C "$work" rm -q --ignore-unmatch ledger/paper.json ledger/kills.json   # pre-multi-coin layout
          for d in ledger/*/; do
            [ -f "$d/paper.json" ] || continue
            mkdir -p "$work/$d"
            cp "$d/paper.json" "$work/$d"
            [ -f "$d/kills.json" ] && cp "$d/kills.json" "$work/$d" || true
          done
          cd "$work"
          git add -A ledger
          git diff --cached --quiet && exit 0
          banks=$(python3 -c "import json, glob; print(' '.join(f\"{p.split('/')[1]} \${json.load(open(p))['broker']['cash']:.2f}\" for p in sorted(glob.glob('ledger/*/paper.json'))))")
          git commit -qm "ledger: ${banks} at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin paper-ledger

      - name: Build the boards
        if: ${{ !cancelled() }}
        run: |
          mkdir -p _site/boards
          cp dashboard/* _site/
          for b in ledger/*/board.json; do
            [ -f "$b" ] && cp "$b" "_site/boards/$(basename "$(dirname "$b")").json"
          done
          [ -f ledger/index.json ] && cp ledger/index.json _site/boards/index.json
          [ -f _site/boards/BTC.json ] && cp _site/boards/BTC.json _site/board.json   # old links keep working
          ls -l _site _site/boards

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site

      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
