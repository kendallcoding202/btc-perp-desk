name: paper desk

# The paper experiments: BTC, ETH and SOL, $150 each, separate accounts, plus VT, a
# $500 vol-trend basket of the three on daily bars (decided at the 00:00 UTC close;
# paper only). Every 15 minutes (or when dispatched): load the ledgers from the
# `paper-ledger` branch, run one step per account on live Hyperliquid prices, save the
# ledgers if anything happened, and publish the boards to GitHub Pages. An account whose
# step fails (say, a rate-limited API call) is retried next run; the others are still
# saved and published.
# GitHub delays (and under load drops) scheduled runs, worst at the top of the hour,
# so the schedule avoids :00 and runs at :04/:19/:34/:49 — each 2h bar closes on an
# even hour and is picked up 4 minutes later. `step` catches up on every bar it
# missed, so a late or skipped run never loses or double-counts a bar.

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: paper-desk
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Load the ledger
        id: load
        run: |
          # A failed fetch must stop the run. Carrying on would open fresh ledgers and the
          # save step would push them over the real ones. Only a branch that doesn't exist yet
          # (ls-remote exit code 2) means "first run, start new ledgers".
          for attempt in 1 2 3; do
            if git fetch --depth=1 origin paper-ledger; then
              git checkout FETCH_HEAD -- ledger/
              exit 0
            fi
            rc=0
            git ls-remote --exit-code --heads origin paper-ledger > /dev/null || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "no paper-ledger branch yet: the step opens new ledgers"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::could not fetch the paper-ledger branch; stopping so the ledgers are not reset"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Desk step
        id: step
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m desk step

      - name: Save the ledgers
        if: ${{ !cancelled() && steps.step.outputs.changed == 'true' }}
        run: |
          git config user.name "paper-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          work="$RUNNER_TEMP/ledger-branch"
          if git fetch --depth=1 origin paper-ledger; then
            git worktree add "$work" FETCH_HEAD
            git -C "$work" checkout -B paper-ledger
          else
            rc=0
            git ls-remote --exit-code --heads origin paper-ledger > /dev/null || rc=$?
            if [ "$rc" -ne 2 ]; then
              echo "::error::could not fetch the paper-ledger branch to save onto; not saving"
              exit 1
            fi
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan paper-ledger
            git -C "$work" rm -rfq .
          fi
          # Never let a run replace an account with a younger one: same start time, and the run
          # count only goes up. A reset needs a deliberate manual edit of the branch.
          python3 - "$work" <<'PY'
          import glob, json, sys
          work = sys.argv[1]
          for new in sorted(glob.glob("ledger/*/paper.json")):
              try:
                  old = json.load(open(f"{work}/{new}"))["meta"]
              except FileNotFoundError:
                  continue
              m = json.load(open(new))["meta"]
              if m["started_ts"] != old["started_ts"] or m["runs"] < old["runs"]:
                  sys.exit(f"::error::{new} would replace the saved account (started {old['started_ts']}, "
                           f"{old['runs']} runs) with started {m['started_ts']}, {m['runs']} runs; not saving")
          PY
          git -C "$work" rm -q --ignore-unmatch ledger/paper.json ledger/kills.json   # pre-multi-coin layout
          for d in ledger/*/; do
            [ -f "$d/paper.json" ] || continue
            mkdir -p "$work/$d"
            cp "$d/paper.json" "$work/$d"
            [ -f "$d/kills.json" ] && cp "$d/kills.json" "$work/$d" || true
          done
          cd "$work"
          git add -A ledger
          git diff --cached --quiet && exit 0
          # each bank, and what of it was deposited or withdrawn (desk/flows.py): money in or out, never profit or loss
          banks=$(python3 -c "import json, glob; tag = lambda n: f' (+\${n:,.2f} deposited, not profit)' if n > 0 else f' (\${-n:,.2f} withdrawn, not a loss)' if n < 0 else ''; print(' '.join(f\"{p.split('/')[1]} \${d['broker']['cash']:.2f}\" + tag(sum(f['amount'] for f in d.get('flows', []))) for p in sorted(glob.glob('ledger/*/paper.json')) for d in [json.load(open(p))]))")
          git commit -qm "ledger: ${banks} at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin paper-ledger

      - name: Build the boards
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        run: |
          mkdir -p _site/boards
          cp dashboard/* _site/
          for b in ledger/*/board.json; do
            [ -f "$b" ] && cp "$b" "_site/boards/$(basename "$(dirname "$b")").json"
          done
          [ -f ledger/index.json ] && cp ledger/index.json _site/boards/index.json
          [ -f _site/boards/BTC.json ] && cp _site/boards/BTC.json _site/board.json   # old links keep working
          ls -l _site _site/boards

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        with:
          path: _site

      - id: deploy
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        uses: actions/deploy-pages@v4
